[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcmake"
version = "0.1.0"
description = "A TypeScript-flavoured language that compiles to CMakeLists.txt"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
scmake = "smartcmake.cli:main"

[tool.setuptools]
packages = ["smartcmake"]
